<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Résumé</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#111110; --paper:#f7f6f2; --muted:#76746c; --faint:#9b998f; --rule:#e3e1d8;
    /* Cuts panel. Its own ink tokens because --muted/--faint are tuned for large serif
       body copy on paper; at 11px mono on a darker ground they measure 3.97:1 and 2.42:1
       against this background, both below the 4.5:1 WCAG AA floor. These are 7.7:1 and
       5.9:1 — AA comfortably, and AAA for the links people actually click. */
    --rail:#eae8e0;                         /* one step down from paper */
    --rail-text:#45433d;                    /* 7.7:1 — cut names, group headings */
    --rail-dim:#5b5952;                     /* 5.9:1 — captions, status, icon buttons */
    --accent:#ff352a;                       /* default accent */
    --display:"Space Grotesk","Arial Narrow",sans-serif;
    --mono:"Space Mono","Courier New",monospace;
    --serif:"Newsreader",Georgia,serif;
    --maxw:940px;
  }
  body.theme-chanel{ --paper:#faf9f6; --rail:#eeece4; --accent:#8c7853; }   /* Chanel: warm paper + gold */
  body.theme-warm{ --paper:#faf9f6; --rail:#efece3; --accent:#b5895a; }     /* warm paper + amber */
  /* optional full-screen video hero (set heroVideo in the data file) */
  .herovideo{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.06; z-index:1;}
  body.has-video #art{opacity:0;}     /* video shows on screen; canvas stays sized for print fallback */

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--serif); line-height:1.5; -webkit-font-smoothing:antialiased;}

  /* toolbar + back link */
  .toolbar{position:fixed; top:16px; right:16px; z-index:50; display:flex; gap:8px;}
  .toolbar button{font-family:var(--mono); font-size:11px; letter-spacing:.04em; text-transform:uppercase; background:rgba(17,17,16,.82); color:#f7f6f2; border:none; padding:9px 12px; border-radius:2px; cursor:pointer; backdrop-filter:blur(6px); transition:background .15s ease;}
  .toolbar button:hover{background:var(--ink);}
  .toolbar button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .backlink{position:fixed; top:16px; left:16px; z-index:50; font-family:var(--mono); font-size:11px; letter-spacing:.04em; text-transform:uppercase; background:rgba(17,17,16,.82); color:#f7f6f2; text-decoration:none; padding:9px 12px; border-radius:2px; backdrop-filter:blur(6px); transition:background .15s ease;}
  .backlink:hover{background:var(--ink);}
  /* The cuts rail owns the top-left corner, so the optional back link steps aside:
     clear of the open panel, or clear of the launcher when it's collapsed. */
  body.has-cuts .backlink{left:280px;}
  body.has-cuts.cuts-collapsed .backlink{left:82px;}

  /* ── cuts panel ───────────────────────────────────────────────────────────────
     A quiet left rail listing every cut. Built from the page's own materials —
     paper, a hairline rule, mono labels — so it reads as part of the document
     rather than as app chrome bolted on. Never printed.
     Below 1340px there isn't room beside the centred page, so it collapses to a
     small launcher and slides over. */
  .cuts{position:fixed; left:0; top:0; bottom:0; width:264px; z-index:60;
    padding:26px 18px 20px; overflow-y:auto; box-sizing:border-box;
    display:flex; flex-direction:column;
    background:var(--rail); border-right:1px solid var(--rule); font-family:var(--mono);}
  .cuts__head{display:flex; align-items:center; justify-content:space-between;
    font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--rail-dim);
    padding:0 8px 12px;}
  .cuts__min{border:none; background:none; cursor:pointer; color:var(--rail-dim); padding:0 0 0 8px;
    font-family:var(--mono); font-size:14px; line-height:1;}
  .cuts__min:hover{color:var(--ink);}
  /* Group headings carry a rule so the eye finds the breaks before it reads the words —
     with a dozen cuts the list is scanned, not read. */
  .cuts__group{font-size:10px; letter-spacing:.13em; text-transform:uppercase; color:var(--rail-text);
    padding:9px 8px 6px; margin-top:12px; border-top:1px solid var(--rule);}
  .cuts a{display:block; font-size:11.5px; letter-spacing:.01em; line-height:1.35;
    color:var(--rail-text); text-decoration:none; padding:6px 8px; border-radius:2px;
    transition:background .12s ease, color .12s ease;}
  .cuts a + a{margin-top:1px;}
  .cuts a:hover{color:var(--ink); background:rgba(17,17,16,.07);}
  .cuts a.active{color:var(--ink); background:rgba(17,17,16,.09); font-weight:700;}
  /* keyboard users need to see where they are, and the rail is a list of links */
  .cuts a:focus-visible, .cuts__act:focus-visible, .cuts__min:focus-visible,
  .cuts__close:focus-visible, .cuts__link:focus-visible, .cuts__open:focus-visible{
    outline:2px solid var(--ink); outline-offset:2px;}

  /* collapsed on purpose, at any width */
  body.cuts-collapsed .cuts{transform:translateX(-100%); transition:transform .2s ease;}
  body.cuts-collapsed .cuts__open{display:block;}

  /* The rail is fixed, so give the document a matching inset instead of letting the panel
     sit on top of it. The résumé then re-centres in what's left, which is what makes the
     rail read as part of the layout rather than a thing floating over the page. */
  body{transition:padding-left .22s cubic-bezier(.22,1,.36,1);}
  body.has-cuts{padding-left:264px;}
  body.has-cuts.cuts-collapsed{padding-left:0;}
  body.paged-ready{padding-left:0 !important;}   /* the paged view owns the whole sheet */
  .cuts__actions{margin-top:14px; padding-top:12px; border-top:1px solid var(--rule); display:flex;
    flex-direction:column; gap:2px;}
  .cuts__act{display:block; width:100%; text-align:left; border:none; background:none; cursor:pointer;
    font-family:var(--mono); font-size:11.5px; letter-spacing:.02em; color:var(--rail-text);
    padding:6px 8px; border-radius:2px; transition:background .12s ease, color .12s ease;}
  .cuts__act:hover{color:var(--ink); background:rgba(17,17,16,.07);}
  .cuts__foot{margin-top:auto; padding:14px 8px 0; border-top:1px solid var(--rule);}
  .cuts__hint{font-size:10.5px; line-height:1.55; color:var(--rail-dim);}
  .cuts__hint code{font-family:var(--mono); color:var(--rail-text);}
  .cuts__link{display:inline-block; margin-top:9px; font-size:10.5px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--rail-text); text-decoration:none;
    border-bottom:1px solid var(--rail-dim); padding:0 0 1px;}
  .cuts__link:hover{color:var(--ink); border-bottom-color:var(--ink);}
  /* says out loud whether the cut buttons can write files, so nobody wonders why the
     button is called "Download starter file" */
  .cuts__mode{display:flex; align-items:center; gap:6px; margin-top:12px;
    font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--rail-dim);}
  .cuts__mode::before{content:""; width:6px; height:6px; border-radius:50%;
    background:var(--rail-dim); flex:0 0 auto;}
  /* colour is never the only signal — the wording says which mode it is too */
  .cuts__mode.on::before{background:#2f6b3d;}
  .cuts__mode.on{color:var(--rail-text);}
  .cuts__close{display:none;}

  /* dialog for the two things a static page genuinely can do: build you a starter file,
     and write the instruction you'd otherwise have to remember. */
  .rc{position:fixed; inset:0; z-index:80; display:flex; align-items:center; justify-content:center;
    background:rgba(17,17,16,.42); padding:20px;}
  .rc__card{width:100%; max-width:460px; background:var(--paper); border-radius:4px; padding:22px;
    box-shadow:0 20px 60px rgba(0,0,0,.28); font-family:var(--mono);}
  .rc__title{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint);
    margin:0 0 14px;}
  .rc label{display:block; font-size:10px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--faint); margin:12px 0 5px;}
  .rc input, .rc textarea{width:100%; box-sizing:border-box; font-family:var(--mono); font-size:12px;
    color:var(--ink); background:#fff; border:1px solid var(--rule); border-radius:2px; padding:8px 9px;
    outline:none;}
  .rc input:focus, .rc textarea:focus{border-color:var(--muted);}
  .rc textarea{min-height:84px; resize:vertical; line-height:1.45;}
  .rc__note{font-size:10px; line-height:1.6; color:var(--muted); margin:14px 0 0;}
  .rc__note code{background:rgba(17,17,16,.06); padding:1px 5px; border-radius:2px;}
  .rc__row{display:flex; gap:8px; margin-top:18px; flex-wrap:wrap;}
  .rc__btn{flex:1 1 auto; border:none; cursor:pointer; font-family:var(--mono); font-size:10px;
    letter-spacing:.08em; text-transform:uppercase; padding:10px 12px; border-radius:2px;
    background:var(--ink); color:var(--paper);}
  .rc__btn--ghost{background:none; color:var(--muted); border:1px solid var(--rule);}
  .rc__btn--ghost:hover{color:var(--ink); border-color:var(--muted);}

  /* collapsed mode: launcher pill, panel slides over the page */
  .cuts__open{position:fixed; left:16px; top:16px; z-index:59; display:none; cursor:pointer; border:none;
    font-family:var(--mono); font-size:11px; letter-spacing:.04em; text-transform:uppercase;
    background:rgba(17,17,16,.82); color:#f7f6f2; padding:9px 12px; border-radius:2px;
    backdrop-filter:blur(6px);}
  .cuts__open:hover{background:var(--ink);}
  /* Because the document is inset rather than covered, the rail can stay open much
     further down: 940px page + 264px rail + margins needs ~1284. Below that there is no
     room to give, so it goes back to sliding over the page. */
  @media (max-width:1280px){
    body.has-cuts, body.has-cuts.cuts-open{padding-left:0;}
  }
  @media (max-width:1280px){
    .cuts{transform:translateX(-100%); transition:transform .2s ease; box-shadow:0 0 40px rgba(0,0,0,.14);}
    body.cuts-open .cuts{transform:none;}
    .cuts__open{display:block;}
    body.cuts-open .cuts__open{display:none;}
    .cuts__close{display:block; position:absolute; right:10px; top:10px; border:none; background:none;
      cursor:pointer; color:var(--faint); font-family:var(--mono); font-size:14px; line-height:1; padding:4px;}
    .cuts__close:hover{color:var(--ink);}
    .cuts__min{display:none;}                 /* narrow screens already have ✕ */
    body.has-cuts .backlink{left:82px;}
    body.has-cuts.cuts-open .backlink{left:280px;}
  }

  /* first-run strip — only while the example data is still in place. Removes itself
     the moment someone puts their own name in cv-data.js. */
  .firstrun{position:fixed; left:0; right:0; bottom:0; z-index:70; display:flex; align-items:center;
    gap:14px; padding:11px 16px; background:var(--ink); color:#f4f2ea;
    font-family:var(--mono); font-size:11px; letter-spacing:.02em; line-height:1.45;}
  .firstrun code{color:#fff; background:rgba(255,255,255,.12); padding:1px 5px; border-radius:2px;}
  .firstrun span{flex:1;}
  .firstrun button{flex:0 0 auto; border:none; background:rgba(255,255,255,.14); color:#f4f2ea;
    font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase;
    padding:7px 11px; border-radius:2px; cursor:pointer;}
  .firstrun button:hover{background:rgba(255,255,255,.24);}

  /* ── changing cuts ────────────────────────────────────────────────────────────
     Switching cut is a real page load, which flashes white. Fade the document out
     before navigating and let it rise back in on arrival, so a cut reads as a change
     of state rather than a reload. The rail itself never moves — it's the fixed thing
     the document changes behind. Print and reduced-motion opt out below. */
  .hero, main, footer{transition:opacity .19s ease;}
  body.leaving .hero, body.leaving main, body.leaving footer{opacity:0;}
  @keyframes cutRise{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}
  @keyframes cutFade{from{opacity:0;} to{opacity:1;}}
  body:not(.paged-ready) main{animation:cutRise .38s cubic-bezier(.22,1,.36,1) both;}
  body:not(.paged-ready) .hero{animation:cutFade .45s ease both;}
  .cuts a{position:relative;}
  .cuts a.active::before{content:""; position:absolute; left:0; top:6px; bottom:6px; width:2px;
    background:var(--accent); animation:cutFade .3s ease both;}

  /* hero */
  .hero{position:relative; background:#000; color:#fff; overflow:hidden;}
  #art{position:absolute; inset:0; width:100%; height:100%; display:block;}
  .hero::after{content:""; position:absolute; inset:0; background:radial-gradient(120% 90% at 30% 60%, rgba(0,0,0,.45) 0%, rgba(0,0,0,.62) 70%, rgba(0,0,0,.78) 100%); pointer-events:none;}
  .hero-inner{position:relative; z-index:2; max-width:var(--maxw); margin:0 auto; padding:120px 40px 44px; min-height:min(96vh,820px); display:flex; flex-direction:column; justify-content:flex-end;}
  .name{font-family:var(--display); font-weight:700; font-size:clamp(2.7rem,8.5vw,5.6rem); line-height:.94; letter-spacing:-.03em; margin:0; text-wrap:balance;}
  .tagline{font-family:var(--mono); font-size:clamp(.72rem,1.5vw,.86rem); letter-spacing:.18em; text-transform:uppercase; margin:22px 0 0; color:#e9e7df; text-shadow:0 1px 3px rgba(0,0,0,.65);}
  .colophon{margin-top:34px; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px 40px; max-width:680px; font-family:var(--mono); font-size:11.5px; letter-spacing:.02em; text-shadow:0 1px 3px rgba(0,0,0,.7);}
  .colophon div{display:flex; gap:10px; line-height:1.5;}
  .colophon .k{color:#c4c1b8; flex:0 0 78px; text-transform:uppercase;}
  .colophon .v{color:#f4f2ea;}
  .colophon a{color:#f4f2ea; text-decoration:none; border-bottom:1px solid rgba(255,255,255,.28);}
  .colophon a:hover{border-bottom-color:#fff;}
  .profile{font-family:var(--serif); font-size:clamp(1rem,1.7vw,1.16rem); line-height:1.45; color:#e9e6dc; max-width:620px; margin:28px 0 0;}

  /* banner cover (variant cover:"banner") — slim header strip, not a full page */
  body.cover-banner .hero-inner{min-height:0; padding:78px 40px 30px;}
  body.cover-banner .name{font-size:clamp(2.1rem,5.5vw,3.4rem);}
  body.cover-banner .tagline{margin-top:16px;}
  body.cover-banner .colophon{margin-top:20px;}
  body.cover-banner .profile{margin-top:14px;}

  /* body */
  main{max-width:var(--maxw); margin:0 auto; padding:8px 40px 100px;}
  section{padding-top:46px;}
  .sec-head{display:flex; align-items:baseline; justify-content:space-between; gap:16px; border-top:1.5px solid var(--ink); padding-top:10px; margin-bottom:22px;}
  .sec-head h2{font-family:var(--display); font-weight:500; font-size:clamp(1.25rem,2.3vw,1.7rem); letter-spacing:-.01em; margin:0;}
  .sec-meta{font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); white-space:nowrap;}
  /* no top rule above the first section (it sits directly under the header) */
  main > section:first-child .sec-head{border-top:none; padding-top:0;}
  /* headerless cut (hideHero): no stray top rule / gap above the first section */
  body.no-hero main > section:first-child{padding-top:8px;}
  body.no-hero main > section:first-child .sec-head{border-top:none; padding-top:0;}

  .entry{display:grid; grid-template-columns:128px 1fr; gap:0 28px; padding:0 0 26px;}
  .entry .when{font-family:var(--mono); font-size:11.5px; letter-spacing:.03em; color:var(--muted); padding-top:3px;}
  .entry .role{font-family:var(--display); font-weight:500; font-size:1.04rem; letter-spacing:-.005em; margin:0 0 5px; color:var(--ink);}
  .entry .desc{font-family:var(--serif); font-size:1rem; color:#3a3933; margin:0; max-width:62ch;}
  .entry .desc-list{font-family:var(--serif); font-size:1rem; color:#3a3933; margin:0; padding-left:15px; max-width:62ch;}
  .entry .desc-list li{margin-top:3px;}
  .entry .desc-list li:first-child{margin-top:0;}
  .entry .desc-list li::marker{color:var(--faint); font-size:.7em;}
  .tags{margin-top:9px; display:flex; flex-wrap:wrap; gap:6px; align-items:center;}
  .tags span{font-family:var(--mono); font-size:10px; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); border:1px solid var(--rule); border-radius:2px; padding:3px 7px;}
  .projlink{font-family:var(--mono); font-size:10px; letter-spacing:.04em; text-transform:uppercase; color:var(--accent); border:1px solid var(--accent); border-radius:2px; padding:3px 8px; text-decoration:none; display:inline-flex; align-items:center; gap:5px; transition:background .15s ease,color .15s ease;}
  .projlink:hover{background:var(--accent); color:#fff;}
  .projlink .arr{font-size:11px; line-height:1;}

  .row{display:grid; grid-template-columns:128px 1fr auto; gap:0 28px; padding:9px 0; border-bottom:1px solid var(--rule); align-items:baseline;}
  .row:last-child{border-bottom:none;}
  .row .when{font-family:var(--mono); font-size:11.5px; color:var(--muted);}
  .row .what{font-family:var(--display); font-weight:400; font-size:.99rem;}
  .row .what em{font-style:normal; color:var(--muted); font-family:var(--serif);}

  .prose{font-family:var(--serif); font-size:1.02rem; color:#3a3933; max-width:70ch; margin:0;}
  .skills{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px 40px;}
  .skill .lab{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); display:block; margin-bottom:3px;}
  .skill .val{font-family:var(--display); font-weight:400; font-size:.97rem; color:var(--ink);}

  footer{max-width:var(--maxw); margin:0 auto; padding:0 40px 60px; font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap;}

  .reveal{opacity:0; transform:translateY(14px); transition:opacity .6s ease, transform .6s ease;}
  .reveal.in{opacity:1; transform:none;}

  @media (max-width:680px){
    .hero-inner{padding:96px 22px 34px;}
    main{padding:8px 22px 70px;} footer{padding:0 22px 50px;}
    .colophon{grid-template-columns:1fr; gap:5px;}
    .entry{grid-template-columns:1fr; gap:4px;}
    .entry .when{padding-top:0; margin-bottom:2px;}
    .row{grid-template-columns:1fr auto;} .row .when{grid-column:1 / -1;}
    .skills{grid-template-columns:1fr;}
  }
  @media (prefers-reduced-motion:reduce){
    .reveal{opacity:1; transform:none; transition:none;}
    .hero, main, footer{transition:none;}
    body:not(.paged-ready) main, body:not(.paged-ready) .hero, .cuts a.active::before{animation:none;}
  }

  /* ── Paged.js download mode (on-demand pagination — see exportPDF() in the script) ──
     When the user hits "Save PDF", Paged.js paginates a clone of the CV into real .pagedjs_page
     nodes inside #paged-target; we swap to that view, print it, then restore the live page. */
  #paged-target{ display:none; }
  #paged-status{ display:none; }
  body.paged-ready{ display:block; background:#fff; }
  body.paged-ready > :not(#paged-target):not(#paged-status):not(script){ display:none !important; }
  body.paged-ready #paged-target{ display:block; }
  body.paging #paged-status{
    display:flex; position:fixed; inset:0; z-index:100; align-items:center; justify-content:center;
    background:var(--paper); font-family:var(--mono); font-size:12px; letter-spacing:.12em;
    text-transform:uppercase; color:var(--muted);
  }

  /* print fallback: if Paged.js can't load we still get a usable native print (no @page here so
     Paged.js's own injected @page wins in the paged path; the cover stays full-cover via .hero). */
  @media print{
    .toolbar,.backlink,.cuts,.cuts__open,.firstrun{display:none !important;}
    .hero,main,footer{opacity:1 !important; animation:none !important; transition:none !important;}
    body{background:#fff; display:flex; flex-direction:column; min-height:100vh;}
    footer{margin-top:auto; padding:10px 0 0; border-top:1px solid var(--rule);}  /* pin to bottom of last page */
    .hero{page:cover; break-after:page; page-break-after:always; background:#000 !important; -webkit-print-color-adjust:exact; print-color-adjust:exact;}
    .hero-inner{height:100vh; min-height:0; padding:0.85in 0.8in; justify-content:flex-end;}
    .name{font-size:3.6rem;}
    main{padding:0;}
    section{padding-top:3px;}
    main > section:first-child{padding-top:0;}
    .sec-head{break-after:avoid; page-break-after:avoid; margin-bottom:3px; padding-top:3px;}
    .entry,.row{break-inside:avoid; page-break-inside:avoid;}
    /* tight vertical rhythm for print only */
    .entry{padding-bottom:2px; gap:0 22px;}
    .entry .role{margin-bottom:1px; font-size:0.98rem;}
    .entry .desc{font-size:0.87rem; line-height:1.2; max-width:none;}
    .entry .desc-list{font-size:0.87rem; line-height:1.2; max-width:none;}
    .entry .when{padding-top:2px;}
    .tags{margin-top:2px;}
    .row{padding:2px 0;}
    .skills{gap:3px 36px;}
    .skill .val{font-size:0.92rem;}
    .prose{font-size:0.95rem; line-height:1.35;}
    .reveal{opacity:1 !important; transform:none !important;}
    .herovideo{display:none !important;}
    body.has-video #art{opacity:1 !important;}
    a{color:inherit;}
    .projlink{border-color:#bbb !important; color:#555 !important;}
    .tagline,.colophon{text-shadow:none !important;}   /* see cv-print.css: shadows double the text in the PDF layer */

    /* banner cover: a full-bleed header strip at the top of page one */
    body.cover-banner .hero{page:auto; break-after:auto; page-break-after:auto;
      width:100vw; margin-left:calc(50% - 50vw); margin-right:calc(50% - 50vw);
      margin-top:0;}                                /* full-width band; no top bleed so the name never clips */
    body.cover-banner .hero-inner{height:auto; min-height:0;
      padding:0.22in 0.2in 0.18in;}                /* re-inset text to align with the 0.2in body margin */
    body.cover-banner .name{font-size:1.5rem;}
    body.cover-banner .tagline{margin-top:6px;}
    body.cover-banner .colophon{margin-top:8px; gap:3px 40px;}
    body.cover-banner .profile{margin-top:7px; font-size:0.92rem;}
    body.cover-banner main > section:first-child{padding-top:18px;}
  }
</style>

<!-- ── PRINT STYLESHEET ────────────────────────────────────────────────────────────
     This lives inline, in a <script type="text/css"> the browser never executes and
     never applies, because Paged.js loads its stylesheets with fetch() — and browsers
     block fetch() of local files on a file:// page. Keeping the CSS in the document and
     handing Paged.js a blob: URL (see printStylesheets()) means you can double-click
     cv.html and still get a proper PDF, with no local server and no terminal.

     Every rule is scoped to .pagedjs_page, so nothing here can affect the screen view.
     Colour and type tokens (--ink, --mono, …) come from :root above and resolve as-is. -->
<script type="text/css" id="print-css">
/* ── every body page ─────────────────────────────────────────────────────────── */
@page {
  size: Letter;
  margin: 0.5in 0.6in 0.55in;

  @top-center {
    content: string(cvname);
    font-family: var(--mono);
    font-size: 8px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--faint);
  }
  @bottom-center {
    content: counter(page) " / " counter(pages);
    font-family: var(--mono);
    font-size: 8px;
    letter-spacing: 0.08em;
    color: var(--faint);
  }
}

/* the running header reads its text from a zero-height source injected at the top of the flow */
.cv-runhead {
  string-set: cvname content(text);
  font-size: 0 !important;
  line-height: 0 !important;
  height: 0;
  margin: 0;
  padding: 0;
  color: transparent;
}

/* ── named cover page: full bleed, no header / no folio ──────────────────────── */
.pagedjs_page .hero { page: cover; }
@page cover {
  margin: 0;
  @top-center { content: none; }
  @bottom-center { content: none; }
}
@page :blank {
  @top-center { content: none; }
  @bottom-center { content: none; }
}
/* never repeat the name in the running header on page one — the cover already shows it */
@page :first {
  @top-center { content: none; }
}

/* ── cover: fill the page, keep the generative art (snapshotted to an <img>) ──── */
.pagedjs_page .hero {
  position: relative;
  height: 100%;
  background: #000 !important;
  color: #fff;
  overflow: hidden;
  break-after: page;
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}
.pagedjs_page .hero .art-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 0;
}
.pagedjs_page .hero-inner {
  height: 100%;
  min-height: 0;
  padding: 0.8in 0.75in;
  justify-content: flex-end;
}
.pagedjs_page .name { font-size: 3.4rem; }
.pagedjs_page .herovideo { display: none !important; }

/* ── banner cover (variant cover:"banner") ───────────────────────────────────────
   A slim header strip at the top of page one instead of a full cover page: the body
   flows in right underneath, and folios + the running header appear on every page. */
body.cover-banner .pagedjs_page .hero {
  page: auto;
  height: auto;
  min-height: 0;
  width: auto;
  break-after: avoid;
  break-inside: avoid;
  margin: 0 0 16px;
}
body.cover-banner .pagedjs_page .hero-inner {
  height: auto;
  min-height: 0;
  padding: 16px 22px;
  justify-content: flex-end;
}
body.cover-banner .pagedjs_page .name { font-size: 1.6rem; }
body.cover-banner .pagedjs_page .tagline { margin-top: 8px; }
body.cover-banner .pagedjs_page .colophon { margin-top: 10px; gap: 3px 36px; }

/* ATS: Chrome paints a text-shadow by writing the glyph run TWICE into the PDF content
   stream, so every shadowed string extracts as "EMAILEMAIL you@example.comyou@example.com"
   and resume parsers store an invalid address. The shadow only ever existed to lift type
   off the hero artwork, which print drops anyway. Run `npm run ats-check` to see it. */
.pagedjs_page .tagline,
.pagedjs_page .colophon { text-shadow: none; }
body.cover-banner .pagedjs_page .profile { margin-top: 8px; font-size: 0.92rem; }
body.cover-banner .pagedjs_page main > section:first-child { padding-top: 4px; }

/* ── body: tight, book-like vertical rhythm ──────────────────────────────────── */
.pagedjs_page main { padding: 0; }
.pagedjs_page section { padding-top: 6px; }
/* headerless cut (hideHero): drop the top rule / gap above the first section */
body.no-hero .pagedjs_page main > section:first-child { padding-top: 0; }
body.no-hero .pagedjs_page main > section:first-child .sec-head { border-top: none; padding-top: 0; }
.pagedjs_page .sec-head {
  break-after: avoid;
  page-break-after: avoid;
  margin-bottom: 5px;
  padding-top: 4px;
}
.pagedjs_page .entry,
.pagedjs_page .row { break-inside: avoid; page-break-inside: avoid; }

/* An orphaned section heading ("Experience" alone at the foot of page 1) is the classic
   Paged.js miss: it applies break-after:avoid inconsistently. Asserting break-before:avoid
   on whatever follows the heading pushes the pair over together. */
.pagedjs_page .sec-head + .entry,
.pagedjs_page .sec-head + .row,
.pagedjs_page .sec-head + .skills,
.pagedjs_page .sec-head + .tags,
.pagedjs_page .sec-head + * { break-before: avoid; page-break-before: avoid; }
/* built by buildPrintContent(): heading + its first entry, wrapped so they travel together */
.pagedjs_page .sec-keep { break-inside: avoid; page-break-inside: avoid; }

/* The date column was 128px + 22px gutter for a string ("2024 — Present") that needs ~102px
   in 11.5px mono. Tightening it widens the text column ~5%, which removes wrapped lines
   throughout without touching a word. nowrap guarantees a date can never break in two. */
.pagedjs_page .entry { padding-bottom: 3px; gap: 0 18px; grid-template-columns: 106px 1fr; }
.pagedjs_page .entry .when { white-space: nowrap; padding-top: 2px; }
.pagedjs_page .entry .role { margin-bottom: 1px; font-size: 0.98rem; }
.pagedjs_page .entry .desc { font-size: 0.88rem; line-height: 1.28; max-width: none; }
.pagedjs_page .entry .desc-list { font-size: 0.88rem; line-height: 1.25; max-width: none; padding-left: 13px; }
.pagedjs_page .entry .desc-list li { margin-top: 0; }
.pagedjs_page .tags { margin-top: 3px; }
.pagedjs_page .row { padding: 2px 0; }
.pagedjs_page .skills { gap: 6px 36px; }
.pagedjs_page .skill .val { font-size: 0.92rem; }
.pagedjs_page .prose { font-size: 0.95rem; line-height: 1.35; }

/* links print as ink; project chips lose their loud accent border */
.pagedjs_page a { color: inherit; }
.pagedjs_page .projlink { border-color: #bbb !important; color: #555 !important; }

/* reveal-on-scroll is a screen affordance — force everything visible in the PDF */
.pagedjs_page .reveal { opacity: 1 !important; transform: none !important; }

/* footer flows at the end of the last page (not pinned) */
.pagedjs_page footer { padding: 12px 0 0; border-top: 1px solid var(--rule); }

/* never paginate the screen-only chrome */
.pagedjs_page .toolbar,
.pagedjs_page .cuts,
.pagedjs_page .cuts__open,
.pagedjs_page .firstrun,
.pagedjs_page .backlink { display: none !important; }
</script>

<!-- Paged.js (web-to-print). auto:false → it never runs on page load; exportPDF() invokes it on demand. -->
<script>window.PagedConfig = { auto: false };</script>
<script defer src="https://unpkg.com/pagedjs@0.4.3/dist/paged.polyfill.js"></script>

<body>

<a class="backlink" id="backlink" href="/">&#8592; Back to website</a>
<div class="toolbar">
  <button id="regen" title="Reroll the generative artwork">&#8635; Regenerate art</button>
  <button id="print" title="Print or save as PDF">&#9113; Save PDF</button>
</div>

<header class="hero">
  <canvas id="art"></canvas>
  <div class="hero-inner" id="hero-inner"></div>
</header>

<main id="cv-main"></main>
<footer id="cv-footer"></footer>

<!-- Paged.js renders the paginated, printable CV here (shown only while saving the PDF) -->
<div id="paged-target" aria-hidden="true"></div>
<div id="paged-status">Preparing PDF…</div>

<script>
/* ============ load the content, then render ============ */
(function(){
  // Load the master data file, then the per-variant files it lists in
  // CV.variantManifest (each registers into CV.variants), THEN render.
  // A variant file that fails to load is skipped — the full CV still works.
  /* Your real résumé belongs in cv-data.local.js, which .gitignore excludes — so you can
     use this daily without your phone number and every company you're applying to landing
     in a public repo. If that file exists it wins; otherwise the shipped example renders.
     ?data=whatever.js overrides both. */
  var params = new URLSearchParams(location.search);
  var explicit = params.get('data');
  var dataFile = explicit || 'cv-data.local.js';
  function loadScript(src, onload, onerror){
    var s = document.createElement('script');
    s.src = src; s.onload = onload; if(onerror) s.onerror = onerror;
    document.head.appendChild(s);
  }
  function loadVariantsThenInit(){
    window.__CV_DATAFILE__ = dataFile;      // what actually loaded, for the write API
    var CV = window.CV || {};
    // Variant files register themselves with `window.CV.variants.<key> = {...}`, which
    // throws if the key doesn't exist — and a throwing script still fires onload, so the
    // failure is silent and every cut vanishes. Guarantee the object rather than trusting
    // the data file to declare it.
    CV.variants = CV.variants || {};
    var manifest = CV.variantManifest || [];
    var dir = CV.variantsDir || 'cv-variants/';
    var i = 0;
    (function next(){
      if(i >= manifest.length){ init(); return; }
      var stem = manifest[i++];
      loadScript(dir + stem + '.js', next, function(){
        console.warn('[cv] variant file failed to load, skipping: ' + dir + stem + '.js');
        next();
      });
    })();
  }
  function failed(){
    document.getElementById('cv-main').innerHTML =
      '<p style="font-family:monospace;padding:40px 0;color:#a33">Could not load <b>'+dataFile+'</b>. Make sure it sits next to cv.html.</p>';
  }
  loadScript(dataFile, loadVariantsThenInit, function(){
    if(explicit) return failed();          // they asked for that file by name
    dataFile = 'cv-data.js';               // no personal copy here — show the example
    loadScript(dataFile, loadVariantsThenInit, failed);
  });
})();

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ============ cuts panel ============
   The left rail listing every cut. This is the UI: someone who downloaded a ZIP and
   double-clicked cv.html should be able to see all their versions without touching a
   URL. Rendered whenever at least one variant exists, and hidden from print. */

function variantLabel(key, v){
  if(v && v.label) return v.label;                 // optional `label:` on a variant wins
  return key.replace(/[-_]+/g, ' ')
            .replace(/\b\w/g, function(c){ return c.toUpperCase(); });
}
function variantGroup(v){ return (v && v.group) ? v.group : 'Other'; }  // optional `group:` family

function renderCuts(){
  if(document.querySelector('.cuts')) return;
  var variants = (window.CV && window.CV.variants) || {};
  var keys = Object.keys(variants).filter(function(k){ return k !== '_template'; });
  if(!keys.length) return;                      // nothing to switch between yet

  var current = new URLSearchParams(location.search).get('role') || '';
  function href(role){
    var p = new URLSearchParams(location.search);
    if(role) p.set('role', role); else p.delete('role');
    var qs = p.toString();
    return location.pathname + (qs ? '?' + qs : '');
  }

  // Bucket by family, preserving first-seen group order; "Other" sinks last.
  var order = [], byGroup = {};
  keys.forEach(function(k){
    var g = variantGroup(variants[k]);
    if(!byGroup[g]){ byGroup[g] = []; order.push(g); }
    byGroup[g].push({ key:k, name:variantLabel(k, variants[k]) });
  });
  order.sort(function(a,b){ return (a==='Other'?1:0) - (b==='Other'?1:0); });

  function row(key, name){
    return '<a data-role="'+esc(key)+'" class="'+(key === current ? 'active' : '')+
           '" href="'+esc(href(key))+'">'+esc(name)+'</a>';
  }
  var rows = row('', 'Full résumé');             // pinned first: clears ?role
  order.forEach(function(g){
    if(order.length > 1 || g !== 'Other') rows += '<div class="cuts__group">'+esc(g)+'</div>';
    byGroup[g].forEach(function(it){ rows += row(it.key, it.name); });
  });

  var repo = (window.CV && window.CV.repoUrl) || '';
  var panel = document.createElement('nav');
  panel.className = 'cuts';
  panel.setAttribute('aria-label', 'Résumé cuts');
  panel.innerHTML =
    '<button class="cuts__close" type="button" aria-label="Close">✕</button>'+
    '<div class="cuts__head"><span>Cuts</span>'+
      '<button class="cuts__min" type="button" title="Hide the panel" aria-label="Hide the panel">‹</button>'+
    '</div>'+ rows +
    '<div class="cuts__actions">'+
      '<button class="cuts__act" type="button" data-act="new">+ New cut</button>'+
      '<button class="cuts__act" type="button" data-act="del">− Remove this cut</button>'+
    '</div>'+
    '<div class="cuts__foot">'+
      '<div class="cuts__hint">Each cut is one file in <code>cv-variants/</code>, '+
      'listed in <code>variantManifest</code>. Nothing is duplicated — a cut only '+
      'filters and rewrites <code>cv-data.js</code>.</div>'+
      (repo ? '<a class="cuts__link" href="'+esc(repo)+'" target="_blank" rel="noopener">How this works</a>' : '')+
      '<div class="cuts__mode" id="cuts-mode" title="">Read-only — run npx recut</div>'+
    '</div>';

  var launcher = document.createElement('button');
  launcher.className = 'cuts__open';
  launcher.type = 'button';
  launcher.textContent = 'Cuts';

  document.body.appendChild(panel);
  document.body.appendChild(launcher);
  document.body.classList.add('has-cuts');   // lets the back link move out of the corner

  /* Collapsed-by-choice is remembered; collapsed-by-width is not, because it isn't a
     choice. Both end up showing the same launcher. */
  try { if(localStorage.getItem('recut-cuts') === 'collapsed') document.body.classList.add('cuts-collapsed'); } catch(e){}

  launcher.addEventListener('click', function(){
    document.body.classList.remove('cuts-collapsed');
    document.body.classList.add('cuts-open');
    try { localStorage.removeItem('recut-cuts'); } catch(e){}
  });
  panel.querySelector('.cuts__min').addEventListener('click', function(){
    document.body.classList.add('cuts-collapsed');
    document.body.classList.remove('cuts-open');
    try { localStorage.setItem('recut-cuts', 'collapsed'); } catch(e){}
  });
  panel.querySelector('.cuts__close').addEventListener('click', function(){
    document.body.classList.remove('cuts-open');
  });

  panel.addEventListener('click', function(e){
    var act = e.target.closest ? e.target.closest('.cuts__act') : null;
    if(!act || !panel.contains(act)) return;
    var role = new URLSearchParams(location.search).get('role') || '';
    if(act.getAttribute('data-act') === 'new') newCutDialog();
    else removeCutDialog(role, variantLabel(role, variants[role]));
  });

  /* Switching cuts never reloads: fade the document out, swap the URL with pushState,
     re-render, fade back in. The rail and the artwork stay put, so the eye reads one
     surface changing rather than the whole window blinking. Reduced motion swaps
     instantly instead. */
  var calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  panel.addEventListener('click', function(e){
    var a = e.target.closest ? e.target.closest('a[data-role]') : null;
    if(!a || !panel.contains(a)) return;
    e.preventDefault();
    document.body.classList.remove('cuts-open');
    if(a.classList.contains('active')) return;                      // already here

    function swap(){
      history.pushState({}, '', a.getAttribute('href'));
      applyRole();
      window.scrollTo(0, 0);
      document.body.classList.remove('leaving');
    }
    if(calm){ swap(); return; }
    panel.querySelectorAll('a[data-role]').forEach(function(x){ x.classList.remove('active'); });
    a.classList.add('active');
    document.body.classList.add('leaving');
    setTimeout(swap, 185);
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape') document.body.classList.remove('cuts-open');
  });
}

/* ============ new / remove cut ============
   A page opened from disk cannot write or delete files, and pretending otherwise would
   be worse than not offering the button. So these do the parts a browser genuinely can:
   build the starter file and hand it to you, and write the instruction — or the AI
   prompt — you would otherwise have to compose yourself. */

/* `npx recut` serves this page from a tiny local server that can write files. When it's
   there the cut buttons do the real thing; opened straight from disk they fall back to
   downloads and prompts. Same page either way — the difference is one fetch. */
window.__RECUT_SERVER__ = false;
function recutMode(on, detail){
  var el = document.getElementById('cuts-mode');
  if(!el) return;
  el.classList.toggle('on', !!on);
  el.textContent = on ? 'Writes enabled' : 'Read-only — run npx recut';
  el.title = on ? ('recut server is serving ' + (detail || 'this folder'))
                : 'Opened straight from disk, so the cut buttons hand you a starter file '+
                  'and an AI prompt instead of writing to the folder. Run `npx recut` for writes.';
}
function recutPing(){
  if(location.protocol === 'file:') return recutMode(false);   // no server to find
  fetch('/api/ping').then(function(r){ return r.ok ? r.json() : null; }).then(function(d){
    if(d && d.ok){ window.__RECUT_SERVER__ = true; recutMode(true, d.dir); }
    else recutMode(false);
  }).catch(function(){ recutMode(false); });
}
function recutCtx(){
  return {
    dataFile: window.__CV_DATAFILE__ || 'cv-data.js',
    variantsDir: (window.CV && window.CV.variantsDir) || 'cv-variants/'
  };
}

function rcSlug(s){
  return String(s || '').toLowerCase().trim()
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);
}
function rcTitle(s){
  return String(s || '').replace(/[-_]+/g, ' ').replace(/\b\w/g, function(c){ return c.toUpperCase(); });
}
function rcCopy(text, btn){
  var done = function(){ var t = btn.textContent; btn.textContent = 'Copied'; setTimeout(function(){ btn.textContent = t; }, 1400); };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done, function(){}); return; }
  var ta = document.createElement('textarea');       // file:// sometimes has no clipboard API
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch(e){}
  ta.remove();
}
function rcDownload(filename, text){
  var url = URL.createObjectURL(new Blob([text], { type: 'text/javascript' }));
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}
function rcModal(html){
  var wrap = document.createElement('div');
  wrap.className = 'rc';
  wrap.innerHTML = '<div class="rc__card">'+html+'</div>';
  function close(){ wrap.remove(); document.removeEventListener('keydown', onKey); }
  function onKey(e){ if(e.key === 'Escape') close(); }
  wrap.addEventListener('click', function(e){ if(e.target === wrap) close(); });
  document.addEventListener('keydown', onKey);
  document.body.appendChild(wrap);
  return { el: wrap, close: close };
}

function starterVariant(key, label){
  return '/* Cut: ' + key + '\n' +
    '   What is this cut arguing? One line, so future-you remembers.\n' +
    '   Preview: cv.html?role=' + key + ' */\n' +
    'window.CV.variants["' + key + '"] = {\n' +
    '  group: "Roles",\n' +
    '  label: "' + label + '",\n' +
    '  tagline: "",                 // leave empty to keep the one in cv-data.js\n' +
    '  cover: "banner",             // slim header strip instead of a full cover page\n' +
    '\n' +
    '  tracks: [],                  // which kinds of entry qualify. Empty = all of them.\n' +
    '  exclude: [],                 // entry ids to drop regardless of tracks\n' +
    '  hide: [],                    // whole section titles to drop\n' +
    '  order: [],                   // section titles in order (ORIGINAL titles — rename runs after)\n' +
    '  rename: {},\n' +
    '\n' +
    '  overrides: {\n' +
    '    // "entry-id": { bullets: ["Rewritten for this application only."] },\n' +
    '  },\n' +
    '};\n';
}

function newCutDialog(){
  var m = rcModal(
    '<p class="rc__title">New cut</p>'+
    '<label for="rc-name">Name it — the company, or the kind of role</label>'+
    '<input id="rc-name" type="text" placeholder="Acme Studio" autocomplete="off" />'+
    '<label for="rc-jd">Paste the job posting (optional — used in the AI prompt)</label>'+
    '<textarea id="rc-jd" placeholder="Paste the description here…"></textarea>'+
    '<p class="rc__note" id="rc-note"></p>'+
    '<div class="rc__row">'+
      (window.__RECUT_SERVER__ ? '<button class="rc__btn" type="button" id="rc-make">Create cut</button>' : '')+
      '<button class="rc__btn'+(window.__RECUT_SERVER__ ? ' rc__btn--ghost' : '')+'" type="button" id="rc-ai">Copy AI prompt</button>'+
      (window.__RECUT_SERVER__ ? '' : '<button class="rc__btn rc__btn--ghost" type="button" id="rc-dl">Download starter file</button>')+
    '</div>');

  var name = m.el.querySelector('#rc-name');
  var jd   = m.el.querySelector('#rc-jd');
  var note = m.el.querySelector('#rc-note');

  var ctx = recutCtx();
  function key(){ return rcSlug(name.value) || 'new-cut'; }
  function sync(){
    note.innerHTML = window.__RECUT_SERVER__
      ? 'Writes <code>' + esc(ctx.variantsDir + key()) + '.js</code> and adds it to '+
        '<code>variantManifest</code> in <code>' + esc(ctx.dataFile) + '</code>.'
      : 'Creates <code>' + esc(ctx.variantsDir + key()) + '.js</code>, then add '+
        '<code>"' + esc(key()) + '"</code> to <code>variantManifest</code> in <code>' + esc(ctx.dataFile) + '</code>.';
  }
  name.addEventListener('input', sync); sync();
  setTimeout(function(){ name.focus(); }, 0);

  var dl = m.el.querySelector('#rc-dl');
  if(dl) dl.addEventListener('click', function(){
    rcDownload(key() + '.js', starterVariant(key(), rcTitle(name.value) || rcTitle(key())));
  });

  var make = m.el.querySelector('#rc-make');
  if(make) make.addEventListener('click', function(){
    make.disabled = true; make.textContent = 'Creating…';
    fetch('/api/cut', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        key: key(), label: rcTitle(name.value) || rcTitle(key()),
        dataFile: ctx.dataFile, variantsDir: ctx.variantsDir
      })
    }).then(function(r){ return r.json().then(function(d){ return { ok: r.ok, d: d }; }); })
      .then(function(res){
        if(!res.ok){ note.innerHTML = '<b>' + esc(res.d.error || 'Could not create the cut.') + '</b>';
                     make.disabled = false; make.textContent = 'Create cut'; return; }
        // the new variant file has to be fetched, so this one time we do reload
        var p = new URLSearchParams(location.search); p.set('role', key());
        location.href = location.pathname + '?' + p.toString();
      }).catch(function(){
        note.innerHTML = '<b>Could not reach the recut server.</b>';
        make.disabled = false; make.textContent = 'Create cut';
      });
  });
  m.el.querySelector('#rc-ai').addEventListener('click', function(e){
    var p = 'Read AGENTS.md in this folder, then create cv-variants/' + key() + '.js '+
      'and add "' + key() + '" to variantManifest in cv-data.js.\n\n'+
      'Build the cut from what is already in cv-data.js — do not invent anything, do not '+
      'change any dates, and do not add metrics I have not given you. Keep it to two pages.'+
      (jd.value.trim() ? '\n\nThe job posting:\n\n' + jd.value.trim() : '');
    rcCopy(p, e.currentTarget);
  });
}

function removeCutDialog(key, label){
  if(!key) return;
  var ctx = recutCtx();
  var server = window.__RECUT_SERVER__;

  var m = rcModal(
    '<p class="rc__title">Remove cut</p>'+
    (server
      ? '<p class="rc__note" style="margin-top:0">Deletes <code>' + esc(ctx.variantsDir + key) + '.js</code> '+
        'and removes <code>"' + esc(key) + '"</code> from <code>variantManifest</code>.</p>'
      : '<p class="rc__note" style="margin-top:0">This page can\'t delete files on your computer. '+
        'To remove <b>' + esc(label || key) + '</b>:</p>'+
        '<p class="rc__note">1. Delete <code>' + esc(ctx.variantsDir + key) + '.js</code><br>'+
        '2. Remove <code>"' + esc(key) + '"</code> from <code>variantManifest</code> in <code>' + esc(ctx.dataFile) + '</code></p>')+
    '<p class="rc__note">Nothing else is affected — your history lives in <code>' + esc(ctx.dataFile) + '</code>, '+
    'and a cut never held content of its own.</p>'+
    '<p class="rc__note" id="rc-err"></p>'+
    '<div class="rc__row">'+
      (server ? '<button class="rc__btn" type="button" id="rc-del">Delete cut</button>' : '')+
      '<button class="rc__btn'+(server ? ' rc__btn--ghost' : '')+'" type="button" id="rc-ai">Copy AI prompt</button>'+
      '<button class="rc__btn rc__btn--ghost" type="button" id="rc-ok">Cancel</button>'+
    '</div>');

  m.el.querySelector('#rc-ok').addEventListener('click', m.close);
  m.el.querySelector('#rc-ai').addEventListener('click', function(e){

           ctx.dataFile + '. Leave ' + ctx.dataFile + ' otherwise untouched.', e.currentTarget);
  });

  var del = m.el.querySelector('#rc-del');
  if(del) del.addEventListener('click', function(){
    del.disabled = true; del.textContent = 'Deleting…';
    var q = new URLSearchParams({ key: key, dataFile: ctx.dataFile, variantsDir: ctx.variantsDir });
    fetch('/api/cut?' + q.toString(), { method: 'DELETE' })
      .then(function(r){ return r.json().then(function(d){ return { ok: r.ok, d: d }; }); })
      .then(function(res){
        if(!res.ok){ m.el.querySelector('#rc-err').innerHTML = '<b>' + esc(res.d.error || 'Could not delete.') + '</b>';
                     del.disabled = false; del.textContent = 'Delete cut'; return; }
        var p = new URLSearchParams(location.search); p.delete('role');
        var qs = p.toString();
        location.href = location.pathname + (qs ? '?' + qs : '');
      }).catch(function(){
        m.el.querySelector('#rc-err').innerHTML = '<b>Could not reach the recut server.</b>';
        del.disabled = false; del.textContent = 'Delete cut';
      });
  });
}

/* ============ variant layer ============
   One master cv-data.js is the source of truth. A variant tailors it for a
   specific application by filtering items by `tracks`, reordering / hiding /
   renaming sections, overriding fields per item id, and swapping tagline etc.
   Activate with ?role=splice  (no role = full CV, unchanged). */
function applyVariant(CV){
  var role = new URLSearchParams(location.search).get('role') || CV.defaultRole;
  if(role === 'full' || role === 'none') return CV;   // ?role=full always escapes back to the full CV
  if(!role || !CV.variants || !CV.variants[role]) return CV;
  var v = CV.variants[role];
  var out = {};
  for(var k in CV){ out[k] = CV[k]; }
  if(v.theme)        out.theme   = v.theme;
  if(v.tagline)      out.tagline = v.tagline;
  if(v.profile!=null)out.profile = v.profile;
  if(v.heroVideo!==undefined) out.heroVideo = v.heroVideo;
  if(v.colophon)     out.colophon = v.colophon;
  if(v.name!==undefined) out.name = v.name;   // variant can blank/replace the hero name (anonymized review)
  if(v.hideHero)     out.hideHero = v.hideHero;   // drop the entire hero banner (headerless résumé)
  if(v.cover)        out.cover    = v.cover;
  if(v.hideFooter)   out.hideFooter = v.hideFooter;

  var tracks    = v.tracks || null;
  var overrides = v.overrides || {};
  var hide      = v.hide || [];
  var exclude   = v.exclude || [];              // item ids to drop regardless of tracks

  function keep(it){
    if(it.id && exclude.indexOf(it.id) >= 0) return false;
    if(!tracks) return true;
    if(!it.tracks) return true;                 // untagged items always show
    return it.tracks.some(function(t){ return tracks.indexOf(t) >= 0; });
  }
  function override(it){
    var r = (it.id && overrides[it.id]) ? Object.assign({}, it, overrides[it.id]) : it;
    if(v.hideLinks && r.link){ r = Object.assign({}, r); r.link = null; }   // drop "View project" buttons
    return r;
  }

  out.sections = (CV.sections||[])
    .filter(function(sec){ return hide.indexOf(sec.title) < 0; })
    .map(function(sec){
      var ns = {}; for(var k in sec){ ns[k] = sec[k]; }
      if(ns.items) ns.items = ns.items.filter(keep).map(override);
      if(ns.rows)  ns.rows  = ns.rows.filter(keep);
      if(ns.type === 'skills' && v.skills) ns.items = v.skills;   // per-variant skills list
      if(v.rows && v.rows[sec.title]) ns.rows = v.rows[sec.title]; // per-variant row list (e.g. trimmed awards)
      return ns;
    })
    .filter(function(sec){                       // drop sections emptied by filtering
      if(sec.type==='entries') return (sec.items&&sec.items.length) || (sec.rows&&sec.rows.length);
      if(sec.type==='rows')    return sec.rows && sec.rows.length;
      return true;                               // prose / skills always kept
    });

  if(v.order){
    out.sections.sort(function(a,b){
      var ia=v.order.indexOf(a.title), ib=v.order.indexOf(b.title);
      return (ia<0?999:ia) - (ib<0?999:ib);
    });
  }
  if(v.rename){
    out.sections.forEach(function(sec){ if(v.rename[sec.title]) sec.title = v.rename[sec.title]; });
  }
  return out;
}

/* One-time wiring. Everything that depends on which cut you're looking at lives in
   applyRole(), so switching cuts never reloads the page. */
function init(){
  if(!window.CV){ return; }
  var printBtn = document.getElementById('print'); if(printBtn) printBtn.addEventListener('click', exportPDF);

  /* "Back to website" only exists if you're hosting this inside a site of your own.
     Set backHref in cv-data.js to switch it on; by default there's nothing to go back to. */
  var back = document.getElementById('backlink');
  if(window.CV.backHref){ back.setAttribute('href', window.CV.backHref); } else { back.remove(); }

  renderCuts();      // build the panel first: the ping writes its status line
  recutPing();
  applyRole();
  window.addEventListener('popstate', function(){ applyRole(); });   // browser back/forward
}

var __lastArtKey = null;

/* Render (or re-render) the document for whichever cut the URL currently names.
   Called on load, on every cut click, and on browser back/forward. */
function applyRole(){
  var CV = applyVariant(window.CV);
  var body = document.body;

  // Body classes are per-cut, so clear the previous cut's before adding this one's.
  body.className = body.className.split(/\s+/).filter(function(c){
    return c && !/^(theme|cover)-/.test(c) && c !== 'no-hero' && c !== 'has-video';
  }).join(' ');
  if(CV.theme) body.classList.add('theme-' + CV.theme);
  if(CV.cover) body.classList.add('cover-' + CV.cover);

  var hero = document.querySelector('.hero');
  var oldVideo = hero.querySelector('.herovideo'); if(oldVideo) oldVideo.remove();
  var regen = document.getElementById('regen');
  if(regen) regen.style.display = '';
  if(CV.heroVideo){
    body.classList.add('has-video');
    var v = document.createElement('video');
    v.className = 'herovideo';
    v.src = CV.heroVideo; v.autoplay = true; v.muted = true; v.loop = true;
    v.playsInline = true; v.setAttribute('playsinline','');
    hero.insertBefore(v, document.getElementById('hero-inner'));
    if(regen) regen.style.display = 'none';
  }

  window.__CV_NAME__ = Array.isArray(CV.name) ? CV.name.join(' ') : CV.name;
  window.__CV_HIDEHERO__ = !!CV.hideHero;
  document.title = window.__CV_NAME__ + ' — CV';

  if(CV.hideHero){
    body.classList.add('no-hero');
    hero.style.display = 'none';
    if(regen) regen.style.display = 'none';
  } else {
    hero.style.display = '';
    renderHero(CV);
  }
  renderMain(CV);
  renderFooter(CV);

  /* <main> persists across cuts, so its entrance animation won't replay on its own.
     Yanking and restoring `animation` forces the reflow that restarts it. */
  var m = document.getElementById('cv-main');
  m.style.animation = 'none'; void m.offsetHeight; m.style.animation = '';

  /* The generative artwork is expensive and looks identical across cuts that share a
     theme — only redraw when something it actually depends on changed. */
  var artKey = (CV.theme || '') + '|' + (CV.hideHero ? 'none' : 'art') + '|' + (CV.heroVideo || '');
  if(!CV.hideHero && artKey !== __lastArtKey){ startArt(CV); }
  __lastArtKey = CV.hideHero ? null : artKey;

  syncCutsActive();
  renderFirstRun(CV);
  observeReveals();
}

/* Keep the rail's highlight in step with what's actually rendered — which is the URL's
   role, or `defaultRole` when the URL names none. Without the fallback, opening the page
   with a defaultRole set highlights "Full résumé" while showing something else. */
function syncCutsActive(){
  var url = new URLSearchParams(location.search).get('role');
  var current = url || (window.CV && window.CV.defaultRole) || '';
  if(current === 'full' || current === 'none') current = '';
  document.querySelectorAll('.cuts a[data-role]').forEach(function(a){
    a.classList.toggle('active', a.getAttribute('data-role') === current);
  });
  var del = document.querySelector('.cuts__act[data-act="del"]');
  if(del) del.style.display = current ? '' : 'none';
}

/* A strip along the bottom, shown only while the shipped example data is still in
   place. It disappears the moment someone puts their own name in cv-data.js — so it
   can never nag a real user, and nobody has to remember to delete it. */
function renderFirstRun(CV){
  if(document.querySelector('.firstrun')) return;      // applyRole() runs on every cut
  var name = Array.isArray(CV.name) ? CV.name.join(' ') : String(CV.name || '');
  if(name.trim() !== 'Jordan Rivera') return;
  try { if(sessionStorage.getItem('recut-firstrun') === 'dismissed') return; } catch(e){}

  var bar = document.createElement('div');
  bar.className = 'firstrun';
  bar.innerHTML =
    '<span>This is the example résumé. Open <code>cv-data.js</code> in any text editor '+
    'and put your own history in — or hand it to an AI along with <code>AGENTS.md</code>.</span>'+
    '<button type="button">Got it</button>';
  bar.querySelector('button').addEventListener('click', function(){
    try { sessionStorage.setItem('recut-firstrun', 'dismissed'); } catch(e){}
    bar.remove();
  });
  document.body.appendChild(bar);
}

function renderHero(CV){
  var nameLines = Array.isArray(CV.name) ? CV.name : [CV.name];
  var colo = (CV.colophon||[]).map(function(c){
    var val = c.href
      ? '<a href="'+esc(c.href)+'">'+esc(c.v)+'</a>'
      : '<span class="v">'+esc(c.v)+'</span>';
    return '<div><span class="k">'+esc(c.k)+'</span>'+val+'</div>';
  }).join('');
  var profile = CV.profile ? '<p class="profile">'+esc(CV.profile)+'</p>' : '';
  document.getElementById('hero-inner').innerHTML =
    '<h1 class="name">'+nameLines.map(esc).join('&nbsp;<br>')+'</h1>'+   /* &nbsp; (not a plain space, which HTML collapses) so the PDF text layer reads "Jane Doe", not "JaneDoe" */
    (CV.tagline ? '<p class="tagline">'+esc(CV.tagline)+'</p>' : '')+
    '<div class="colophon">'+colo+'</div>'+ profile;
}

function entryHTML(it){
  var tags = (it.tags||[]).map(function(t){ return '<span>'+esc(t)+'</span>'; }).join('');
  var link = it.link
    ? '<a class="projlink" href="'+esc(it.link.href)+'" target="_blank" rel="noopener noreferrer">'+
        esc(it.link.label||'View project')+' <span class="arr">&#8599;</span></a>'
    : '';
  var meta = (tags || link) ? '<div class="tags">'+tags+link+'</div>' : '';
  return '<div class="entry reveal">'+
      '<div class="when">'+esc(it.when)+'</div>'+
      '<div class="body">'+
        '<p class="role">'+esc(it.role)+'</p>'+
        (it.bullets && it.bullets.length
           ? '<ul class="desc-list">'+it.bullets.map(function(b){ return '<li>'+esc(b)+'</li>'; }).join('')+'</ul>'
           : (it.desc? '<p class="desc">'+esc(it.desc)+'</p>' : ''))+
        meta+
      '</div>'+
    '</div>';
}
function rowHTML(r){
  var note = r.note ? ' <em>— '+esc(r.note)+'</em>' : '';
  return '<div class="row reveal"><div class="when">'+esc(r.when||'')+'</div>'+
    '<div class="what">'+esc(r.what)+note+'</div><div></div></div>';
}

function renderMain(CV){
  // Drop sections with nothing to show, so scaffolded/empty categories never
  // render a blank header (mirrors the empty-section drop in applyVariant).
  function hasContent(sec){
    if(sec.type==='entries') return (sec.items&&sec.items.length) || (sec.rows&&sec.rows.length);
    if(sec.type==='rows')    return sec.rows && sec.rows.length;
    if(sec.type==='prose')   return !!sec.text;
    if(sec.type==='skills')  return sec.items && sec.items.length;
    return true;
  }
  var html = (CV.sections||[]).filter(hasContent).map(function(sec){
    var head = '<div class="sec-head"><h2>'+esc(sec.title)+'</h2>'+
               (sec.meta? '<span class="sec-meta">'+esc(sec.meta)+'</span>' : '')+'</div>';
    var body = '';
    if(/awards/i.test(sec.title) && sec.rows){
      sec.rows = sec.rows.slice().sort(function(a,b){
        function y(r){ var m=String(r.when||'').match(/\d{4}/); return m? +m[0] : 0; }
        return y(b) - y(a);
      });
    }
    if(sec.type === 'entries'){
      body = (sec.items||[]).map(entryHTML).join('') + (sec.rows||[]).map(rowHTML).join('');
    } else if(sec.type === 'rows'){
      body = (sec.rows||[]).map(rowHTML).join('');
    } else if(sec.type === 'prose'){
      body = '<p class="prose reveal">'+esc(sec.text)+'</p>';
    } else if(sec.type === 'skills'){
      body = '<div class="skills reveal">'+(sec.items||[]).map(function(k){
        return '<div class="skill"><span class="lab">'+esc(k.label)+'</span><span class="val">'+esc(k.value)+'</span></div>';
      }).join('')+'</div>';
    }
    return '<section>'+head+body+'</section>';
  }).join('');
  document.getElementById('cv-main').innerHTML = html;
}

function renderFooter(CV){
  if(CV.hideFooter){ document.getElementById('cv-footer').style.display = 'none'; return; }
  var name = Array.isArray(CV.name)? CV.name.join(' ') : CV.name;
  document.getElementById('cv-footer').innerHTML =
    /* the footer's right-hand side is whichever colophon row looks like your site */
    '<span>'+esc(name)+' — Curriculum Vitae</span><span>'+esc((CV.colophon||[]).reduce(function(a,c){return /^(web|site|portfolio)$/i.test(c.k) ? c.v : a;},''))+'</span>';
}

function observeReveals(){
  var els = document.querySelectorAll('.reveal');
  if(!('IntersectionObserver' in window)){ els.forEach(function(e){e.classList.add('in');}); return; }
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target);} });
  },{threshold:0.12});
  els.forEach(function(e){ io.observe(e); });
}

/* ============ generative hero ============ */
function startArt(CV){
  var canvas = document.getElementById('art'), ctx = canvas.getContext('2d');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W,H,DPR,ribbons,seed,raf,t0;

  var PALETTES = {
    default: [[31,31,224],[255,53,42],[120,40,255],[255,120,30]],
    warm:    [[244,242,236],[196,193,186],[150,140,120],[181,137,90]],
    chanel:  [[244,242,236],[196,193,186],[150,140,120],[176,148,92]]
  };
  var PALETTE = PALETTES[CV.theme] || PALETTES.default;

  function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

  function build(sd){
    var r=rng(sd); ribbons=[]; var n=5+Math.floor(r()*3);
    for(var i=0;i<n;i++){
      var pts=[], segs=5, baseY=r()*H;
      for(var j=0;j<=segs;j++){ pts.push({x:(j/segs)*W*1.2-W*0.1, y:baseY+(r()-0.5)*H*0.9, amp:40+r()*120, ph:r()*Math.PI*2, sp:0.15+r()*0.4}); }
      var ca=PALETTE[Math.floor(r()*PALETTE.length)], cb=PALETTE[Math.floor(r()*PALETTE.length)];
      if(cb===ca) cb=PALETTE[(PALETTE.indexOf(ca)+1)%PALETTE.length];
      ribbons.push({pts:pts, ca:ca, cb:cb, w:60+r()*150, blur:30+r()*60});
    }
  }
  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    var rect=canvas.getBoundingClientRect(); W=rect.width; H=rect.height;
    canvas.width=W*DPR; canvas.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
    build(seed); draw(0);
  }
  function yAt(p,time){ return p.y + Math.sin(time*0.0004*p.sp + p.ph)*p.amp*(reduce?0:1); }
  function draw(time){
    ctx.clearRect(0,0,W,H); ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation='lighter';
    ribbons.forEach(function(rb){
      ctx.save(); ctx.filter='blur('+rb.blur+'px)'; ctx.lineWidth=rb.w; ctx.lineCap='round';
      var g=ctx.createLinearGradient(0,0,W,H);
      g.addColorStop(0,'rgba('+rb.ca.join(',')+',0.55)'); g.addColorStop(1,'rgba('+rb.cb.join(',')+',0.55)');
      ctx.strokeStyle=g; ctx.beginPath(); var p=rb.pts;
      for(var i=0;i<p.length;i++){ var yy=yAt(p[i],time);
        if(i===0) ctx.moveTo(p[i].x,yy);
        else { var px=(p[i-1].x+p[i].x)/2, py=(yAt(p[i-1],time)+yy)/2; ctx.quadraticCurveTo(p[i-1].x,yAt(p[i-1],time),px,py); } }
      ctx.stroke(); ctx.restore();
    });
    ctx.globalCompositeOperation='source-over';
  }
  var staticOnly = reduce || !!CV.heroVideo;
  function loop(time){ if(!t0)t0=time; draw(time-t0); raf=requestAnimationFrame(loop); }
  function start(){ if(raf)cancelAnimationFrame(raf); t0=0; if(staticOnly) draw(0); else raf=requestAnimationFrame(loop); }

  seed=424242; resize(); start();
  window.addEventListener('resize', resize);
  document.getElementById('regen').addEventListener('click', function(){ seed=(Math.random()*1e9)|0; build(seed); if(staticOnly) draw(0); });
}

/* ============ PDF export via Paged.js ============
   Paginates a clone of the live CV (cover + body + footer) into real pages — page numbers, a
   running header, and a full-bleed cover — instead of leaning on the browser's print engine.
   Shape: new Previewer().preview(content, printStylesheets(), target).
   Falls back to a plain window.print() if the Paged.js polyfill didn't load. */

/* Paged.js takes its stylesheets either as URLs it will fetch, or as an object mapping a
   name to CSS *text*. We use the text form deliberately: a URL means fetch(), and fetch()
   is blocked for local files on a file:// page — and for blob: URLs there too, since the
   page's origin is null. Either would hang the export with no error. Passing the text
   means nothing is fetched, so Save PDF works identically whether this page was
   double-clicked or served by `npx recut`. The CSS lives in
   <script type="text/css" id="print-css"> in the head. */
function printStylesheets(){
  var el = document.getElementById('print-css');
  var css = el ? el.textContent : '';
  var sheets = {}; sheets['cv-print.css'] = css;
  return [sheets];
}
/* The cover art goes into the PDF as a data: URI, and a full-resolution PNG of a
   viewport-sized canvas is several megabytes of base64 — which Chrome's print preview then
   has to decode and rasterize, and that is most of the wait between "paginated" and "the
   dialog appeared". The artwork is a soft gradient, so a downscaled JPEG is visually
   identical at print size and roughly an order of magnitude smaller. PNG stays as the
   fallback for browsers that won't encode JPEG. */
function artSnapshot(src){
  var MAX = 1600;
  var scale = Math.min(1, MAX / Math.max(src.width || 1, src.height || 1));
  var out = src;
  if(scale < 1){
    out = document.createElement('canvas');
    out.width = Math.round(src.width * scale);
    out.height = Math.round(src.height * scale);
    var ctx = out.getContext('2d');
    ctx.fillStyle = '#000';                       // JPEG has no alpha; the hero sits on black
    ctx.fillRect(0, 0, out.width, out.height);
    ctx.drawImage(src, 0, 0, out.width, out.height);
  }
  var jpg = out.toDataURL('image/jpeg', 0.82);
  return (jpg && jpg.indexOf('data:image/jpeg') === 0) ? jpg : out.toDataURL('image/png');
}

function buildPrintContent(){
  var name = window.__CV_NAME__ || document.title.replace(/ — CV$/, '');
  var heroHTML = '';
  if(!window.__CV_HIDEHERO__){
    // clone the hero and snapshot the generative <canvas> to an <img> (a cloned canvas is blank)
    var hero = document.querySelector('.hero').cloneNode(true);
    var srcCanvas = document.getElementById('art');
    var cloneCanvas = hero.querySelector('canvas');
    if(cloneCanvas && srcCanvas){
      var img = document.createElement('img');
      img.className = 'art-img';
      try { img.src = artSnapshot(srcCanvas); } catch(e){ /* tainted canvas — skip art */ }
      cloneCanvas.parentNode.replaceChild(img, cloneCanvas);
    }
    var vid = hero.querySelector('.herovideo'); if(vid && vid.parentNode) vid.parentNode.removeChild(vid);
    hero.removeAttribute('id');
    Array.prototype.forEach.call(hero.querySelectorAll('[id]'), function(e){ e.removeAttribute('id'); });
    heroHTML = hero.outerHTML;
  }
  var main = document.getElementById('cv-main').cloneNode(true);
  var foot = document.getElementById('cv-footer').cloneNode(true);
  // drop ids from the clones so the paginated copy never duplicates an id
  [main, foot].forEach(function(node){
    if(node.removeAttribute) node.removeAttribute('id');
    if(node.querySelectorAll) Array.prototype.forEach.call(node.querySelectorAll('[id]'), function(e){ e.removeAttribute('id'); });
  });
  /* Paged.js honours neither break-after:avoid on .sec-head nor break-before:avoid on the
     entry after it, so a heading strands at the foot of a page. Glue each heading to its
     first entry in one wrapper and let break-inside:avoid carry the pair across together. */
  Array.prototype.forEach.call(main.querySelectorAll('.sec-head'), function(head){
    var first = head.nextElementSibling;
    if(!first) return;
    var keep = document.createElement('div');
    keep.className = 'sec-keep';
    head.parentNode.insertBefore(keep, head);
    keep.appendChild(head);
    keep.appendChild(first);
  });
  return '<div class="cv-runhead">'+esc(name)+' — CV</div>' + heroHTML + main.outerHTML + foot.outerHTML;
}

/* Chrome names the saved PDF after document.title, so retitle around the print call and
   put it back afterwards. "Resume_Jane_Doe_2026-01-30" beats "Résumé.pdf", which the
   browser dedups into Résumé (2), Résumé (3) and which tells a recruiter nothing in a
   downloads folder. The ?role= key is appended when one is active, so same-day exports
   of different cuts never collide and the file says which cut it is:
   Resume_Jane_Doe_product_2026-01-30. A plain cv.html omits it. */
function printFilename(){
  var name = (window.__CV_NAME__ || document.title.replace(/ — CV$/, '') || 'CV')
               .replace(/\s+/g, '_').replace(/[^A-Za-z0-9_-]/g, '');
  var role = (new URLSearchParams(location.search).get('role') || '').replace(/[^A-Za-z0-9_-]/g, '');
  var d = new Date(), pad = function(n){ return (n < 10 ? '0' : '') + n; };
  return 'Resume_' + name + (role ? '_' + role : '') +
         '_' + d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
}

function printWithFilename(){
  var original = document.title;
  document.title = printFilename();
  var restore = function(){ document.title = original; window.removeEventListener('afterprint', restore); };
  window.addEventListener('afterprint', restore);
  setTimeout(restore, 60000);          // belt and braces if afterprint never fires
  window.print();
}

function exportPDF(){
  var btn = document.getElementById('print');
  // fallback: polyfill missing → native print with the @media print fallback styles
  if(!(window.Paged && window.Paged.Previewer)){ printWithFilename(); return; }

  var label = btn ? btn.textContent : '';
  if(btn){ btn.disabled = true; btn.textContent = '⟳ Preparing'; }

  var status = document.getElementById('paged-status');
  function say(msg){ console.log('[cv] ' + msg); if(status) status.textContent = msg; }

  // snapshot the live (visible) CV first, THEN swap to the paginated view
  var content, target;
  try {
    say('building print content…');
    content = buildPrintContent();
    target = document.getElementById('paged-target');
    target.innerHTML = '';
  } catch(err){
    console.error('[cv] buildPrintContent threw:', err);
    if(btn){ btn.disabled = false; btn.textContent = label; }
    printWithFilename();
    return;
  }
  document.body.classList.add('paged-ready', 'paging');   // show (measurable) target, hide live view
  say('paginating…');

  /* Pagination is genuinely slow on a long CV — several seconds is normal, and a silent
     button that long reads as a crash. Count pages as Paged.js lays them out so there's
     something moving. */
  var seen = 0;
  var watcher = new MutationObserver(function(){
    var n = target.querySelectorAll('.pagedjs_page').length;
    if(n !== seen){ seen = n; say('laying out page ' + n + '…'); }
  });
  watcher.observe(target, { childList: true, subtree: true });

  /* Paged.js can also hang rather than reject — a stylesheet that never resolves leaves
     its promise pending forever. Race it, so the worst case is the browser's own print
     dialog rather than a dead button. Generous, because slow is not the same as stuck. */
  var settled = false;
  function finish(ok, err){
    if(settled) return; settled = true;
    watcher.disconnect();
    if(err) console.error('[cv] Paged.js export failed — falling back to native print:', err);
    if(btn){ btn.disabled = false; btn.textContent = label; }
    if(ok){
      /* Chrome now renders its own print preview, which takes a moment on a page with a
         full-bleed cover. Keep the overlay up saying so — but drop it in the frame before
         window.print(), or the status text would print onto the first page. */
      say('opening the print dialog…');
      requestAnimationFrame(function(){ setTimeout(function(){
        document.body.classList.remove('paging');
        printWithFilename();
      }, 80); });
    } else {
      document.body.classList.remove('paging', 'paged-ready');
      if(status) status.textContent = 'Preparing PDF…';
      printWithFilename();
    }
  }
  var giveUp = setTimeout(function(){ finish(false, new Error('timed out after 45s')); }, 45000);

  new window.Paged.Previewer().preview(content, printStylesheets(), target)
    .then(function(){ clearTimeout(giveUp); finish(true); })
    .catch(function(err){ clearTimeout(giveUp); finish(false, err); });
}

/* restore the live, scrolling CV once the print dialog closes (fires on print OR cancel) */
window.addEventListener('afterprint', function(){
  document.body.classList.remove('paged-ready', 'paging');
  var t = document.getElementById('paged-target'); if(t) t.innerHTML = '';
});
</script>
</body>
</html>
